version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: bifrost_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal_network

  # Container utilitário temporário para execução da carga inicial de DDL
  db-init:
    image: mcr.microsoft.com/mssql/tools:latest
    container_name: bifrost_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql/init.sql:/init.sql
    networks:
      - internal_network
    entrypoint: >
      /bin/bash -c "
      echo 'Aguardando inicializacao do schema...';
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong@Passw0rd2026!' -C -i /init.sql;
      echo 'Banco de dados de tabelas criados com sucesso!';
      "

  api:
    build:
      context: .
      dockerfile: src/Bifrost.IngestionApi/Dockerfile
    container_name: bifrost_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServerConnection=Server=sqlserver,1433;Database=BrowserHistoryDb;User Id=sa;Password=YourStrong@Passw0rd2026!;TrustServerCertificate=True;
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully # API só sobe após o db-init rodar com sucesso!
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  mssql_data:
